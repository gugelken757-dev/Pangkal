<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow - VS Code Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none; }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <div class="flex flex-col md:flex-row min-h-screen">
        <nav class="w-full md:w-72 bg-white border-r border-slate-200 p-6 flex flex-col gap-2 z-50">
            <div class="flex items-center gap-3 mb-10 px-2">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1 class="text-xl font-black tracking-tight text-slate-900">StudyFlow</h1>
            </div>

            <button onclick="switchView('dashboard')" id="nav-dashboard" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-indigo-50 text-indigo-600 font-bold transition-all w-full">
                <i class="fas fa-th-large w-5"></i> Dashboard
            </button>
            <button onclick="switchView('stats')" id="nav-stats" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-slate-500 hover:bg-slate-50 font-semibold transition-all w-full">
                <i class="fas fa-chart-pie w-5"></i> Statistik
            </button>
            
            <div class="mt-auto pt-6 border-t border-slate-100">
                <div class="bg-indigo-600 text-white p-5 rounded-3xl relative overflow-hidden shadow-xl">
                    <p class="text-[10px] font-bold text-indigo-200 uppercase tracking-widest mb-1">Target Hari Ini</p>
                    <p class="text-3xl font-black mb-1"><span id="sidebar-progress">0</span>%</p>
                    <div class="w-full bg-indigo-400/30 h-1.5 rounded-full mt-2 overflow-hidden">
                        <div id="progress-bar-fill" class="bg-white h-full transition-all duration-700 w-0"></div>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-1 p-6 md:p-10 bg-[#fbfcfd] overflow-y-auto max-h-screen">
            <div id="dashboard-view" class="view-section animate-fade">
                <header class="flex flex-col lg:flex-row lg:items-center justify-between gap-6 mb-10">
                    <div>
                        <h2 class="text-4xl font-black text-slate-900 tracking-tight">Halo, Pejuang! 👋</h2>
                        <p id="auth-status" class="text-rose-500 mt-2 text-sm font-bold flex items-center gap-2">
                            <i class="fas fa-exclamation-circle"></i> Menyiapkan koneksi cloud...
                        </p>
                    </div>
                    <div class="flex gap-3">
                        <div class="hidden sm:flex bg-white border border-slate-100 px-5 py-3 rounded-2xl shadow-sm items-center gap-4 mr-2">
                            <div id="real-time-clock" class="text-xl font-black text-slate-800 tabular-nums leading-none">00:00:00</div>
                        </div>
                        <button onclick="openModal('mandatory-modal')" class="bg-slate-900 text-white px-6 py-4 rounded-2xl font-bold hover:bg-slate-800 transition-all flex items-center gap-2">
                            <i class="fas fa-calendar-plus"></i> Jadwal Wajib
                        </button>
                        <button onclick="openModal('target-modal')" class="bg-indigo-600 text-white px-6 py-4 rounded-2xl font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all flex items-center gap-2">
                            <i class="fas fa-plus"></i> Target
                        </button>
                    </div>
                </header>

                <div class="grid grid-cols-1 xl:grid-cols-12 gap-8">
                    <div class="xl:col-span-8 space-y-10">
                        <section>
                            <h3 class="font-black text-slate-400 uppercase tracking-widest text-xs mb-5 flex items-center gap-3">
                                <span class="w-8 h-1 bg-rose-500 rounded-full"></span> JADWAL RUTIN WAJIB
                            </h3>
                            <div id="mandatory-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
                        </section>
                        <section>
                            <h3 class="font-black text-slate-400 uppercase tracking-widest text-xs mb-5 flex items-center gap-3">
                                <span class="w-8 h-1 bg-indigo-500 rounded-full"></span> TARGET HARI INI
                            </h3>
                            <div id="target-list" class="grid grid-cols-1 gap-3"></div>
                        </section>
                    </div>
                    <aside class="xl:col-span-4">
                        <div class="bg-white rounded-[2.5rem] p-8 border border-slate-200 shadow-sm text-center sticky top-6">
                            <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-indigo-50 text-indigo-600 rounded-full text-[10px] font-black uppercase mb-6">
                                <span class="w-2 h-2 bg-indigo-600 rounded-full animate-pulse"></span> Sesi Pomodoro
                            </div>
                            <div id="timer-display" class="text-7xl font-black text-slate-900 mb-8 tabular-nums tracking-tighter">25:00</div>
                            <div class="flex justify-center gap-4">
                                <button id="timer-toggle" class="w-20 h-20 bg-indigo-600 text-white rounded-[2rem] flex items-center justify-center text-2xl shadow-xl hover:scale-105 active:scale-95 transition-all">
                                    <i class="fas fa-play" id="timer-icon"></i>
                                </button>
                                <button onclick="resetTimer()" class="w-20 h-20 bg-slate-100 text-slate-500 rounded-[2rem] flex items-center justify-center text-2xl hover:bg-slate-200 transition-all">
                                    <i class="fas fa-redo-alt"></i>
                                </button>
                            </div>
                        </div>
                    </aside>
                </div>
            </div>

            <div id="stats-view" class="view-section hidden animate-fade">
                <h2 class="text-4xl font-black text-slate-900 mb-10">Analisis Belajar 📊</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                    <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase mb-2">Total Sesi Pomodoro</p>
                        <p class="text-4xl font-black text-indigo-600"><span id="stats-sessions">0</span></p>
                    </div>
                    <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase mb-2">Menit Belajar</p>
                        <p class="text-4xl font-black text-emerald-500"><span id="stats-time">0</span></p>
                    </div>
                    <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase mb-2">Target Selesai</p>
                        <p class="text-4xl font-black text-rose-500"><span id="stats-done">0</span></p>
                    </div>
                </div>
                <div class="bg-white p-10 rounded-[2rem] border border-slate-200 shadow-sm h-96">
                    <canvas id="statsChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <div id="target-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[70] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl">
            <h3 class="text-2xl font-black mb-6">Tambah Target 🎯</h3>
            <input type="text" id="target-title" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border border-slate-200 mb-4 outline-none focus:border-indigo-500" placeholder="Belajar apa hari ini?">
            <input type="number" id="target-duration" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border border-slate-200 mb-6 outline-none focus:border-indigo-500" placeholder="Durasi (Menit)" value="30">
            <div class="flex gap-3">
                <button onclick="closeModal('target-modal')" class="flex-1 py-4 text-slate-500 font-bold hover:bg-slate-100 rounded-2xl">Batal</button>
                <button onclick="addTarget()" class="flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-bold">Simpan</button>
            </div>
        </div>
    </div>

    <div id="mandatory-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[70] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl">
            <h3 class="text-2xl font-black mb-6">Jadwal Wajib 🕒</h3>
            <input type="text" id="mandatory-title" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border border-slate-200 mb-4 outline-none focus:border-slate-900" placeholder="Nama Aktivitas (misal: Review)">
            <input type="text" id="mandatory-time" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border border-slate-200 mb-6 outline-none focus:border-slate-900" placeholder="Waktu (misal: 19:00 - 20:00)">
            <div class="flex gap-3">
                <button onclick="closeModal('mandatory-modal')" class="flex-1 py-4 text-slate-500 font-bold hover:bg-slate-100 rounded-2xl">Batal</button>
                <button onclick="addMandatory()" class="flex-1 py-4 bg-slate-900 text-white rounded-2xl font-bold">Simpan</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-8 right-8 z-[100] flex flex-col gap-3"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        /* 
           PASTE CONFIG FIREBASE KAMU DI SINI 
           Dapatkan di: Firebase Console > Settings > Your Apps 
        */
        const firebaseConfig = { apiKey: "AIzaSyA0sbdG6Xs5MTVevPRVWY26ZqBOnq1q12I", authDomain: "first-project-9855b.firebaseapp.com", databaseURL: "https://first-project-9855b-default-rtdb.firebaseio.com", projectId: "first-project-9855b", storageBucket: "first-project-9855b.firebasestorage.app", messagingSenderId: "554784223525", appId: "1:554784223525:web:969078e7b4d3d371976acc", measurementId: "G-1V4W6ZNSNL"};
        };

        const state = {
            userId: null,
            targets: [],
            mandatory: [],
            timer: { timeLeft: 1500, isRunning: false, interval: null },
            sessions: parseInt(localStorage.getItem('sf_sessions') || '0')
        };

        let db, auth;

        async function initApp() {
            try {
                // Jika API Key masih default, beri peringatan
                if (firebaseConfig.apiKey === "PASTE_DI_SINI") {
                    document.getElementById('auth-status').innerHTML = `<i class="fas fa-exclamation-triangle"></i> Ganti config Firebase di VS Code!`;
                    return;
                }

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        state.userId = user.uid;
                        document.getElementById('auth-status').className = "text-indigo-500 mt-2 text-sm font-bold flex items-center gap-2";
                        document.getElementById('auth-status').innerHTML = `<i class="fas fa-check-circle"></i> Sinkronisasi Cloud Berhasil`;
                        startSync();
                    }
                });
            } catch (err) {
                console.error(err);
                document.getElementById('auth-status').innerText = "Gagal Connect. Cek Firebase Config.";
            }
        }

        function startSync() {
            const tRef = query(collection(db, `users/${state.userId}/targets`), orderBy('createdAt', 'desc'));
            const mRef = query(collection(db, `users/${state.userId}/mandatory`), orderBy('createdAt', 'desc'));

            onSnapshot(tRef, (snap) => {
                state.targets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            });

            onSnapshot(mRef, (snap) => {
                state.mandatory = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            });
        }

        // GLOBAL FUNCTIONS
        window.openModal = (id) => document.getElementById(id).classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

        window.addTarget = async () => {
            const title = document.getElementById('target-title').value;
            const duration = parseInt(document.getElementById('target-duration').value) || 0;
            if (!title || !state.userId) return;
            
            await addDoc(collection(db, `users/${state.userId}/targets`), {
                title, duration, completed: false, createdAt: Date.now()
            });
            closeModal('target-modal');
            showToast("Target ditambahkan!");
        };

        window.addMandatory = async () => {
            const title = document.getElementById('mandatory-title').value;
            const time = document.getElementById('mandatory-time').value;
            if (!title || !state.userId) return;

            await addDoc(collection(db, `users/${state.userId}/mandatory`), {
                title, time, createdAt: Date.now()
            });
            closeModal('mandatory-modal');
            showToast("Jadwal disimpan!");
        };

        window.toggleTarget = async (id, status) => {
            const ref = doc(db, `users/${state.userId}/targets`, id);
            await updateDoc(ref, { completed: !status, completedAt: !status ? Date.now() : null });
        };

        window.deleteTarget = async (id) => {
            await deleteDoc(doc(db, `users/${state.userId}/targets`, id));
            showToast("Dihapus", "error");
        };

        window.deleteMandatory = async (id) => {
            await deleteDoc(doc(db, `users/${state.userId}/mandatory`, id));
            showToast("Jadwal dihapus", "error");
        };

        window.showToast = (msg, type = "success") => {
            const t = document.createElement('div');
            t.className = `px-6 py-4 rounded-2xl text-white font-bold shadow-xl animate-fade ${type === 'success' ? 'bg-indigo-600' : 'bg-rose-500'}`;
            t.innerText = msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        };

        function renderUI() {
            const tList = document.getElementById('target-list');
            const mList = document.getElementById('mandatory-list');

            // Render Targets
            tList.innerHTML = '';
            state.targets.forEach(t => {
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between p-6 rounded-[2rem] border transition-all ${t.completed ? 'bg-emerald-50 border-emerald-100' : 'bg-white border-slate-100'}`;
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <button onclick="toggleTarget('${t.id}', ${t.completed})" class="w-8 h-8 rounded-full border-2 flex items-center justify-center ${t.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-200'}">
                            ${t.completed ? '<i class="fas fa-check text-xs"></i>' : ''}
                        </button>
                        <div>
                            <p class="font-bold ${t.completed ? 'line-through text-slate-400' : ''}">${t.title}</p>
                            <span class="text-[10px] font-black uppercase text-slate-400">${t.duration} MENIT</span>
                        </div>
                    </div>
                    <button onclick="deleteTarget('${t.id}')" class="opacity-0 group-hover:opacity-100 text-rose-400 p-2"><i class="fas fa-trash"></i></button>
                `;
                tList.appendChild(div);
            });

            // Render Mandatory
            mList.innerHTML = '';
            state.mandatory.forEach(m => {
                const div = document.createElement('div');
                div.className = "group bg-slate-900 p-6 rounded-[2rem] flex items-center justify-between shadow-lg";
                div.innerHTML = `
                    <div>
                        <p class="text-indigo-400 text-[10px] font-black uppercase">${m.time}</p>
                        <p class="text-white font-bold">${m.title}</p>
                    </div>
                    <button onclick="deleteMandatory('${m.id}')" class="opacity-0 group-hover:opacity-100 text-white/50 hover:text-rose-400"><i class="fas fa-times"></i></button>
                `;
                mList.appendChild(div);
            });

            // Update Progress
            const done = state.targets.filter(t => t.completed).length;
            const perc = state.targets.length ? Math.round((done / state.targets.length) * 100) : 0;
            document.getElementById('sidebar-progress').innerText = perc;
            document.getElementById('progress-bar-fill').style.width = `${perc}%`;
        }

        window.switchView = (view) => {
            document.querySelectorAll('.view-section').forEach(v => v.classList.add('hidden'));
            document.getElementById(`${view}-view`).classList.remove('hidden');
            if (view === 'stats') updateStatsUI();
        };

        // TIMER LOGIC
        document.getElementById('timer-toggle').onclick = () => {
            if (state.timer.isRunning) {
                clearInterval(state.timer.interval);
                state.timer.isRunning = false;
                document.getElementById('timer-icon').className = "fas fa-play";
            } else {
                state.timer.isRunning = true;
                document.getElementById('timer-icon').className = "fas fa-pause";
                state.timer.interval = setInterval(() => {
                    state.timer.timeLeft--;
                    updateTimerDisplay();
                    if (state.timer.timeLeft <= 0) {
                        clearInterval(state.timer.interval);
                        state.sessions++;
                        localStorage.setItem('sf_sessions', state.sessions);
                        showToast("Sesi Selesai!");
                        resetTimer();
                    }
                }, 1000);
            }
        };

        window.resetTimer = () => {
            clearInterval(state.timer.interval);
            state.timer.timeLeft = 1500;
            state.timer.isRunning = false;
            document.getElementById('timer-icon').className = "fas fa-play";
            updateTimerDisplay();
        };

        function updateTimerDisplay() {
            const m = Math.floor(state.timer.timeLeft / 60);
            const s = state.timer.timeLeft % 60;
            document.getElementById('timer-display').innerText = `${m}:${s.toString().padStart(2, '0')}`;
        }

        let chart = null;
        function updateStatsUI() {
            const completed = state.targets.filter(t => t.completed);
            document.getElementById('stats-sessions').innerText = state.sessions;
            document.getElementById('stats-time').innerText = completed.reduce((a, b) => a + (b.duration || 0), 0) + ' m';
            document.getElementById('stats-done').innerText = completed.length;

            const ctx = document.getElementById('statsChart').getContext('2d');
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Selesai', 'Pending'],
                    datasets: [{
                        data: [completed.length, state.targets.length - completed.length || 1],
                        backgroundColor: ['#4f46e5', '#f1f5f9'],
                        borderWidth: 0
                    }]
                },
                options: { cutout: '80%', maintainAspectRatio: false }
            });
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('real-time-clock').innerText = now.toLocaleTimeString('id-ID');
        }, 1000);

        initApp();
    </script>
</body>
</html>
